{% extends "layout.html" %}
{% block content %}

<!-- Connect page-specific CSS -->
<link rel="stylesheet" href="{{ url_for('static', filename='css/settings.css') }}">

<h2>Settings</h2>

<form action="/settings/save" method="POST" class="settings-box">

    <div class="setting-row">
        <label for="darkSwitch">Dark Mode</label>
        <input class="form-check-input" type="checkbox" name="dark" id="darkSwitch"
            {% if settings and settings.dark_mode %}checked{% endif %}>
    </div>

    <div class="setting-row">
        <label for="notifySwitch">Enable Notifications</label>
        <input class="form-check-input" type="checkbox" name="notify" id="notifySwitch"
            {% if settings and settings.notifications %}checked{% endif %}>
    </div>

    <button class="save-btn">Save Settings</button>
</form>

{% endblock %}
